---
# Renders the Docker test environment's configs from the real role templates,
# role defaults and example inventory. Output: test/docker/generated/.
- name: Render Docker test configs
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars_files:
    - ../../roles/gocast/defaults/main.yml
    - ../../roles/routeserver/defaults/main.yml
    - ../../roles/dns/defaults/main.yml
    - ../../roles/syslog/defaults/main.yml
    - ../../inventories/example/group_vars/all/anycast.yml
  tasks:
    - name: Define test agents and their services
      ansible.builtin.set_fact:
        gen: "{{ playbook_dir }}/generated"
        # The inventory's two service hosts. Both run both services, so each
        # VIP has two anycast nodes behind it.
        test_agents:
          - name: dns01
            ip: "{{ hostvars['dns01.example.net'].ansible_host | default('10.1.10.11') }}"
          - name: syslog01
            ip: "{{ hostvars['syslog01.example.net'].ansible_host | default('10.1.10.21') }}"
        # Same shape the dns/syslog roles register. DNS uses a UDP port monitor
        # here instead of the exec check, since the containers run no bind9.
        test_services:
          - name: dns
            port: "{{ dns.port }}"
            proto: "{{ dns.proto }}"
            vip: "{{ dns.vip }}"
            anycast: true
            monitor: { type: udp, port: "{{ dns.port }}" }
          - name: syslog
            port: "{{ syslog.port }}"
            proto: "{{ syslog.proto }}"
            vip: "{{ syslog.vip }}"
            anycast: true
            monitor: "{{ syslog.monitor }}"

    - name: Ensure generated directory exists
      ansible.builtin.file:
        path: "{{ gen }}"
        state: directory
        mode: "0755"

    - name: Render GoCast agent configs
      ansible.builtin.template:
        src: ../../roles/gocast/templates/gocast.yaml.j2
        dest: "{{ gen }}/gocast-{{ item.name }}.yaml"
        mode: "0644"
      vars:
        gocast_local_ip: "{{ item.ip }}"
        anycast_services: "{{ test_services }}"
        gocast_monitor_interval: 5s
        gocast_communities: ["65010:100"]
      loop: "{{ test_agents }}"

    - name: Render route-server configs
      ansible.builtin.template:
        src: ../../roles/routeserver/templates/gobgpd.conf.j2
        dest: "{{ gen }}/gobgpd-{{ item.name }}.conf"
        mode: "0644"
      vars:
        routeserver_router_id: "{{ item.address }}"
      loop: "{{ route_servers }}"

    - name: Render core switch configs
      ansible.builtin.template:
        src: core.conf.j2
        dest: "{{ gen }}/gobgpd-core{{ '%02d' | format(idx + 1) }}.conf"
        mode: "0644"
      loop: "{{ core_peers }}"
      loop_control:
        index_var: idx
