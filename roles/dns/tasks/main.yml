---
- name: Install DNS package
  ansible.builtin.package:
    name: "{{ dns.package }}"
    state: present

- name: Ensure DNS configuration directory exists
  ansible.builtin.file:
    path: "{{ dns.config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render named options
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: "{{ dns.config_dir }}/named.conf.options"
    owner: root
    group: root
    mode: "0644"
  notify: Restart DNS

- name: Enable DNS service
  ansible.builtin.service:
    name: "{{ dns.service_name }}"
    enabled: true
    state: started

- name: Register DNS with Anycast
  ansible.builtin.set_fact:
    anycast_services: >-
      {{
        anycast_services | default([]) +
        [{
          'name': 'dns',
          'port': dns.port,
          'proto': dns.proto,
          'vip': dns.vip,
          'anycast': dns.anycast,
          'service_unit': dns.service_name ~ '.service',
          'monitor': dns.monitor
        }]
      }}
  when: dns.anycast | bool
