---
dns_check_script_dir: /usr/local/lib/gocast-checks
dns_check_script: "{{ dns_check_script_dir }}/dns_check.sh"
dns_check_package: dnsutils
dns_check_domains:
  - example.com
  - example.net

dns:
  package: bind9
  service_name: bind9
  config_dir: /etc/bind
  listen_address: 0.0.0.0
  port: 53
  proto: udp
  anycast: true
  vip: 10.20.0.53/32
  recursion: true
  monitor:
    type: exec
    command: "{{ dns_check_script }}"
