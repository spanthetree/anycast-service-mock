---
- name: Ensure GoCast group exists
  ansible.builtin.group:
    name: "{{ gocast_group }}"
    system: true

- name: Ensure GoCast user exists
  ansible.builtin.user:
    name: "{{ gocast_user }}"
    group: "{{ gocast_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Ensure GoCast configuration directory exists
  ansible.builtin.file:
    path: "{{ gocast_config_dir }}"
    state: directory
    owner: root
    group: "{{ gocast_group }}"
    mode: "0750"

- name: Install GoCast binary
  ansible.builtin.copy:
    src: "{{ gocast_binary_src }}"
    dest: "{{ gocast_binary }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart GoCast
  when: gocast_install_binary | bool

- name: Validate route-server peers for GoCast
  ansible.builtin.assert:
    that:
      - route_servers | length > 0
      - item.name is defined
      - item.peer_ip is defined or item.address is defined
    fail_msg: "Each route server needs a name and either address or peer_ip."
  loop: "{{ route_servers }}"

- name: Render GoCast agent configuration
  ansible.builtin.template:
    src: gocast.yaml.j2
    dest: "{{ gocast_config_dir }}/gocast.yaml"
    owner: root
    group: "{{ gocast_group }}"
    mode: "0640"
  notify: Restart GoCast

- name: Install GoCast systemd unit
  ansible.builtin.template:
    src: gocast.service.j2
    dest: /etc/systemd/system/gocast.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart GoCast

- name: Enable GoCast service
  ansible.builtin.systemd:
    name: gocast
    enabled: true
    state: started
    daemon_reload: true
