---
- name: Render example Anycast configs
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars_files:
    - ../roles/gocast/defaults/main.yml
    - ../roles/routeserver/defaults/main.yml
    - ../roles/dns/defaults/main.yml
    - ../roles/syslog/defaults/main.yml
    - ../inventories/example/group_vars/all/anycast.yml
  tasks:
    - name: Derive local agent IP and subscribed anycast services
      ansible.builtin.set_fact:
        gocast_local_ip: "{{ hostvars['dns01.example.net'].ansible_host }}"
        anycast_services: >-
          {{
            (dns.anycast | ternary([{
              'name': 'dns',
              'port': dns.port,
              'proto': dns.proto,
              'vip': dns.vip,
              'anycast': dns.anycast,
              'service_unit': dns.service_name ~ '.service',
              'monitor': dns.monitor
            }], []))
            +
            (syslog.anycast | ternary([{
              'name': 'syslog',
              'port': syslog.port,
              'proto': syslog.proto,
              'vip': syslog.vip,
              'anycast': syslog.anycast,
              'service_unit': syslog.service_name ~ '.service',
              'monitor': syslog.monitor
            }], []))
          }}

    - name: Ensure generated example directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ playbook_dir }}/generated/gocast"
        - "{{ playbook_dir }}/generated/routeserver"

    - name: Render GoCast agent config peering with every route server
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/gocast/templates/gocast.yaml.j2"
        dest: "{{ playbook_dir }}/generated/gocast/gocast.yaml"
        mode: "0644"

    - name: Render GoCast systemd unit
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/gocast/templates/gocast.service.j2"
        dest: "{{ playbook_dir }}/generated/gocast/gocast.service"
        mode: "0644"

    - name: Render GoBGP route-server config for each route server
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/routeserver/templates/gobgpd.conf.j2"
        dest: "{{ playbook_dir }}/generated/routeserver/gobgpd-{{ item.name }}.conf"
        mode: "0644"
      vars:
        routeserver_router_id: "{{ item.address }}"
      loop: "{{ route_servers }}"

    - name: Render GoBGP route-server systemd unit
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/routeserver/templates/gobgpd.service.j2"
        dest: "{{ playbook_dir }}/generated/routeserver/gobgpd.service"
        mode: "0644"
